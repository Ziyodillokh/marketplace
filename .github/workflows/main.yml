name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p 22 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 22 "$SSH_USER@$SSH_HOST" 'bash -s' << 'REMOTE_DEPLOY'
            set -e
            APP_DIR="/opt/marketplace"
            cd $APP_DIR

            echo "=== git pull ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Backend ==="
            cd $APP_DIR/backend
            npm ci --omit=dev=false --no-audit --no-fund 2>&1 | tail -3 || npm install --no-audit --no-fund 2>&1 | tail -3
            npx prisma generate 2>&1 | tail -2
            npx prisma migrate deploy 2>&1 | tail -5
            npm run build 2>&1 | tail -3

            echo "=== Webapp ==="
            cd $APP_DIR/webapp
            npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -3
            npm run build 2>&1 | tail -3

            echo "=== Admin ==="
            cd $APP_DIR/admin
            npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -3
            npm run build 2>&1 | tail -3

            echo "=== PM2 reload ==="
            cd $APP_DIR
            pm2 reload ecosystem.config.cjs --update-env
            pm2 save

            echo "=== Health check ==="
            sleep 3
            curl -s -f -o /dev/null -m 10 -w "API: HTTP %{http_code}\n" http://127.0.0.1:2400/health
            curl -s -f -o /dev/null -m 10 -w "Webapp: HTTP %{http_code}\n" http://127.0.0.1:2401/
            curl -s -f -o /dev/null -m 10 -w "Admin: HTTP %{http_code}\n" http://127.0.0.1:2402/admin/login

            echo "✓ Deploy tugadi"
          REMOTE_DEPLOY

      - name: Verify production
        run: |
          curl -s -f -o /dev/null -m 15 -w "Production HTTPS: %{http_code}\n" https://marketplace.yuksalish.dev/health
          echo "✓ Production is alive"
