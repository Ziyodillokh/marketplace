# ═══════════════════════════════════════════════════════════════════
# Production deploy — Google Cloud serveriga avtomatik
#
# Ikki rejim qo'llab-quvvatlanadi (vars.DEPLOY_MODE bilan tanlanadi):
#   1. "gcloud" — Workload Identity Federation + gcloud compute ssh (tavsiya)
#   2. "ssh"    — oddiy SSH key (sodda, lekin private key GitHub'da)
#
# Default: ssh.
# Kerakli secret/var'lar uchun deploy/DEPLOY.md ga qarang.
# ═══════════════════════════════════════════════════════════════════

name: Deploy to production (GCP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force deploy (CI tugashini kutmasdan)"
        type: boolean
        default: false
      skip_health_check:
        description: "Production tekshiruvni o'tkazib yuborish"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─── 1. CI o'tdimi kutamiz ───────────────────────────────
  wait-for-ci:
    name: CI tugashini kutish
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          running-workflow-name: 'CI tugashini kutish'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success,skipped

  # ─── 2. Deploy ───────────────────────────────────────────
  deploy:
    name: Deploy to ${{ vars.DEPLOY_HOST || 'production' }}
    needs: [wait-for-ci]
    if: always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped' || github.event.inputs.force == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Variant A: gcloud (Workload Identity Federation) ───
      - name: Authenticate to Google Cloud
        if: vars.DEPLOY_MODE == 'gcloud'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        if: vars.DEPLOY_MODE == 'gcloud'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via gcloud SSH (IAP tunnel)
        if: vars.DEPLOY_MODE == 'gcloud'
        env:
          TELEGRAM_NOTIFY_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
        run: |
          # Telegram env'larini remote serverga uzatish uchun --command ichida export qilamiz
          gcloud compute ssh "${{ vars.GCP_INSTANCE_NAME }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --command="export TELEGRAM_NOTIFY_TOKEN='${TELEGRAM_NOTIFY_TOKEN}'; export TELEGRAM_NOTIFY_CHAT_ID='${TELEGRAM_NOTIFY_CHAT_ID}'; cd /opt/marketplace && bash deploy/deploy.sh" \
            --quiet

      # ─── Variant B: Oddiy SSH (default) ──────────────────────
      - name: Set up SSH
        if: vars.DEPLOY_MODE != 'gcloud'
        env:
          SSH_HOST_RAW: ${{ secrets.SSH_HOST }}
          SSH_USER_RAW: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Secret'lardan CR/LF va bo'shliqlarni olib tashlash —
          # Windows'dan nusxalanganda yashirin \r kirib qolishi mumkin
          # va "remote username contains invalid characters" xatosini beradi
          SSH_HOST=$(printf '%s' "$SSH_HOST_RAW" | tr -d '[:space:]')
          SSH_USER=$(printf '%s' "$SSH_USER_RAW" | tr -d '[:space:]')

          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret bo'sh — Repo Settings → Secrets → Actions'da o'rnating"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::SSH_USER secret bo'sh"
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret bo'sh"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Private key — CR'larni olib tashlab yozamiz (CRLF kirsa key buziladi)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p 22 -T 10 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Keyingi step uchun tozalangan qiymatlarni saqlash
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"

          echo "  ✓ SSH_HOST: $SSH_HOST"
          echo "  ✓ SSH_USER: $SSH_USER"
          echo "  ✓ Private key uzunligi: $(wc -c < ~/.ssh/id_ed25519) bayt"

      - name: Deploy via SSH
        if: vars.DEPLOY_MODE != 'gcloud'
        env:
          TELEGRAM_NOTIFY_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -p 22 \
              "${SSH_USER}@${SSH_HOST}" \
              "export TELEGRAM_NOTIFY_TOKEN='${TELEGRAM_NOTIFY_TOKEN}'; \
               export TELEGRAM_NOTIFY_CHAT_ID='${TELEGRAM_NOTIFY_CHAT_ID}'; \
               cd /opt/marketplace && bash deploy/deploy.sh"

      # ─── 3. Production tasdiqlash ──────────────────────────
      - name: Verify production
        if: github.event.inputs.skip_health_check != 'true'
        run: |
          set -e
          echo "═══ Production HTTPS tekshiruvi ═══"
          FAILED=0
          for url in \
            "https://selliostore.uz/" \
            "https://admin.selliostore.uz/login" \
            "https://clients.selliostore.uz/" \
            "https://dev.selliostore.uz/login" \
            "https://selliostore.uz/api/health"
          do
            # 3 ta urinish
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$url" 2>/dev/null || echo "000")
              if [[ "$code" =~ ^[23] ]]; then
                echo "  ✓ $url → $code"
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::$url qaytardi HTTP $code (3 marta urinishdan keyin)"
                FAILED=$((FAILED + 1))
              else
                echo "  ⚠ $url → $code (qayta urinish ${attempt}/3)"
                sleep 5
              fi
            done
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} ta endpoint sog'lom emas"
            exit 1
          fi

      - name: Telegram bildirishnoma (muvaffaqiyatli)
        if: success() && env.TG_TOKEN != ''
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="✅ *Deploy MUVAFFAQIYATLI*%0A%0A👤 ${ACTOR}%0A📝 ${COMMIT_MSG//$'\n'/%0A}%0A🔗 \`${COMMIT_SHA:0:7}\`%0A%0A[Workflow ko'rish](${RUN_URL})"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}" > /dev/null

      - name: Telegram bildirishnoma (xato)
        if: failure() && env.TG_TOKEN != ''
        env:
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="❌ *Deploy MUVAFFAQIYATSIZ*%0A%0A👤 ${ACTOR}%0A🔗 \`${COMMIT_SHA:0:7}\`%0A%0A[Log ko'rish](${RUN_URL})"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}" > /dev/null
