name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is empty — set it in repo Settings → Secrets → Actions"
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is empty — paste the OpenSSH private key in repo Settings → Secrets → Actions"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pre-populate known_hosts; failure is non-fatal because StrictHostKeyChecking=accept-new handles first contact
          ssh-keyscan -H -p 22 -T 10 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "⚠ ssh-keyscan could not reach $SSH_HOST — falling back to accept-new"

      - name: Deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -p 22 \
              "$SSH_USER@$SSH_HOST" 'bash -s' << 'REMOTE_DEPLOY'
            set -e
            APP_DIR="/opt/marketplace"
            cd $APP_DIR

            echo "=== git pull ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Backend ==="
            cd $APP_DIR/backend
            npm ci --omit=dev=false --no-audit --no-fund 2>&1 | tail -3 || npm install --no-audit --no-fund 2>&1 | tail -3
            npx prisma generate 2>&1 | tail -2
            npx prisma migrate deploy 2>&1 | tail -5
            npm run db:seed:supermarket 2>&1 | tail -30 || echo "⚠ supermarket seed failed (non-fatal)"
            npm run build 2>&1 | tail -3

            echo "=== Webapp ==="
            cd $APP_DIR/webapp
            npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -3
            npm run build 2>&1 | tail -3

            echo "=== Admin ==="
            cd $APP_DIR/admin
            npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -3
            npm run build 2>&1 | tail -3

            echo "=== PM2 reload ==="
            cd $APP_DIR
            pm2 reload ecosystem.config.cjs --update-env
            pm2 save

            echo "=== Health check ==="
            sleep 3
            curl -s -f -o /dev/null -m 10 -w "API: HTTP %{http_code}\n" http://127.0.0.1:2400/health
            curl -s -f -o /dev/null -m 10 -w "Webapp: HTTP %{http_code}\n" http://127.0.0.1:2401/
            curl -s -f -o /dev/null -m 10 -w "Admin: HTTP %{http_code}\n" http://127.0.0.1:2402/admin/login

            echo "✓ Deploy tugadi"
          REMOTE_DEPLOY

      - name: Verify production
        run: |
          curl -s -f -o /dev/null -m 15 -w "Production HTTPS: %{http_code}\n" https://marketplace.yuksalish.dev/health
          echo "✓ Production is alive"
